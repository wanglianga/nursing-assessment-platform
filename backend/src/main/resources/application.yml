server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:nursingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: aBase64EncodedSecretKeyForNursingPlatformThatIsLongEnough2024
  expiration: 86400000
